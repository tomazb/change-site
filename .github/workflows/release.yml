---
name: Release Management

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.0)'
        required: true
        type: string
      release_type:
        description: 'Type of release'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version format
        id: validate
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="$INPUT_VERSION"

          # Ensure version starts with 'v'
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format vX.Y.Z (e.g., v1.2.0)"
            exit 1
          fi

          # Fetch remote tags so we detect tags that exist only on remote
          git fetch --tags

          # Check if tag already exists (local or remote)
          if git tag -l | grep -q "^$version$" || git ls-remote --tags origin | grep -q "refs/tags/$version$"; then
            echo "Error: Tag $version already exists"
            exit 1
          fi

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "✅ Version $version is valid"

  update-version:
    name: Update Version References
    runs-on: ubuntu-latest
    needs: validate-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Update version in files
        run: |
          version="${{ needs.validate-version.outputs.version }}"
          version_number="${version#v}"  # Remove 'v' prefix

          echo "Updating version to $version_number in project files..."

          # Update change-site.sh (script uses readonly SCRIPT_VERSION=)
          sed -i "s/^readonly SCRIPT_VERSION=.*/readonly SCRIPT_VERSION=\"$version_number\"/" change-site.sh

          # Update README.md current version
          sed -i \
            "s/### v[0-9]\+\.[0-9]\+\.[0-9]\+ (Current)/### $version (Current)/" \
            README.md
          sed -i \
            "s/### v[0-9]\+\.[0-9]\+\.[0-9]\+$/### v$version_number/" \
            README.md

          echo "Version updated to $version_number"

      - name: Commit version changes
        run: |
          version="${{ needs.validate-version.outputs.version }}"

          git fetch origin develop
          git pull --rebase origin develop || { echo "Failed to pull latest develop"; exit 1; }

          git add change-site.sh README.md
          git commit -m "chore: Bump version to $version"
          git push --force-with-lease origin develop

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate-version, update-version]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Pull latest changes
        run: git pull origin develop

      - name: Create and push tag
        run: |
          version="${{ needs.validate-version.outputs.version }}"

          git tag -a "$version" -m "Release $version"
          git push origin "$version"

      - name: Generate release notes
        id: release_notes
        run: |
          version="${{ needs.validate-version.outputs.version }}"
          version_number="${version#v}"

          # Create release notes
          cat > release_notes.md << EOF
          ## Change-Site $version

          ### Release Type: ${{ github.event.inputs.release_type }}

          ### What's New
          - Enhanced CI/CD pipeline with comprehensive testing
          - Automated release management workflow
          - Security scanning and vulnerability checks
          - Documentation validation and markdown linting

          ### Improvements
          - Streamlined development workflow
          - Automated testing across multiple environments
          - Enhanced security practices
          - Better documentation structure

          ### Technical Details
          - All tests passing across basic, integration, and enhanced test suites
          - Security scan completed with no critical vulnerabilities
          - Documentation validated and up-to-date
          - Build artifacts generated and verified

          ### Compatibility
          - Fully backward compatible with previous versions
          - Supports RHEL 8, RHEL 9, and RHEL 10
          - No breaking changes to existing functionality

          ### Installation
          \`\`\`bash
          # Download and extract
          wget https://github.com/tomazb/change-site/releases/download/$version/change-site-*.tar.gz
          tar -xzf change-site-*.tar.gz

          # Make executable
          chmod +x change-site.sh
          \`\`\`

          ### Verification
          \`\`\`bash
          # Verify installation
          ./change-site.sh --version

          # Test with dry-run
          ./change-site.sh --dry-run 192.168 172.23
          \`\`\`
          EOF

          echo "Release notes generated for $version"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.version }}
          name: ${{ needs.validate-version.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create merge PR to main
        if: github.event.inputs.prerelease != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = '${{ needs.validate-version.outputs.version }}';

            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:develop`,
              base: 'main'
            });

            if (existing.length > 0) {
              core.info(`Open PR already exists: #${existing[0].number}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `chore(release): merge develop into main for ${version}`,
              head: 'develop',
              base: 'main',
              body: [
                `Automated release handoff for ${version}.`,
                '',
                '- Source: `develop`',
                '- Target: `main`',
                '- Trigger: release workflow'
              ].join('\n')
            });

            core.notice(`Created PR #${pr.data.number}: ${pr.data.html_url}`);

  post-release:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: [validate-version, create-release]
    if: github.event.inputs.prerelease != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update development version
        run: |
          version="${{ needs.validate-version.outputs.version }}"
          version_number="${version#v}"

          # Parse version components
          IFS='.' read -r major minor patch <<< "$version_number"

          # Increment based on release type
          case "${{ github.event.inputs.release_type }}" in
            "major")
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            "minor")
              minor=$((minor + 1))
              patch=0
              ;;
            "patch")
              patch=$((patch + 1))
              ;;
          esac

          next_version="$major.$minor.$patch"
          echo "Next development version: $next_version"

          # Switch to develop and update version
          git checkout develop
          git pull origin develop

          # Update to next development version (script uses readonly SCRIPT_VERSION=)
          sed -i "s/^readonly SCRIPT_VERSION=.*/readonly SCRIPT_VERSION=\"$next_version-dev\"/" change-site.sh

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add change-site.sh
          git commit -m "chore: Prepare for next development iteration ($next_version-dev)"
          git push origin develop

      - name: Create milestone for next version
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.validate-version.outputs.version }}';
            const versionNumber = version.replace('v', '');
            const [major, minor, patch] = versionNumber.split('.').map(Number);

            let nextMajor = major;
            let nextMinor = minor;
            let nextPatch = patch;

            switch ('${{ github.event.inputs.release_type }}') {
              case 'major':
                nextMajor++;
                nextMinor = 0;
                nextPatch = 0;
                break;
              case 'minor':
                nextMinor++;
                nextPatch = 0;
                break;
              case 'patch':
                nextPatch++;
                break;
            }

            const nextVersion = `v${nextMajor}.${nextMinor}.${nextPatch}`;

            try {
              await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: nextVersion,
                description: `Milestone for ${nextVersion} release`
              });
              console.log(`Created milestone: ${nextVersion}`);
            } catch (error) {
              console.log(`Milestone ${nextVersion} may already exist: ${error.message}`);
            }
